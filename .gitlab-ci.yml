include:
  - local: .gitlab/ci/validation.yml
  - local: .gitlab/ci/backend.yml
  - local: .gitlab/ci/unity.yml
  - local: .gitlab/ci/ai.yml
  - local: .gitlab/ci/deploy.yml

stages:
  - validate
  - verify
  - integration
  - deploy

workflow:
  auto_cancel:
    on_new_commit: none
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $A305_DEPLOY_CHILD == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'

default:
  interruptible: true

# Deployment children select checks from the last successful release, not the last push.
.deployment-parent-skips:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: never
    - if: '($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev") || ($CI_PIPELINE_SOURCE == "web" && $RUN_DEV_DEPLOY == "true")'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || ($CI_PIPELINE_SOURCE == "web" && $RUN_PROD_DEPLOY == "true"))'
      when: never

.linux-job:
  tags:
    - a305-linux

.docker-job:
  extends: .linux-job
  services:
    - name: docker:29.1.3-dind-rootless
      alias: docker
      docker:
        user: "0"
      entrypoint: ["/bin/sh", "-ec"]
      command:
        - |
          # Keep outer ephemeral ports separate from rootless Docker's published ports.
          sysctl -w "net.ipv4.ip_local_port_range=15000 25000"
          exec su -s /bin/sh -c 'exec dockerd-entrypoint.sh --tls=false' rootless
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    FF_NETWORK_PER_BUILD: "true"
