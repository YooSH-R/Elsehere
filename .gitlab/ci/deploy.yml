.dev-deployment-source:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "web" && $RUN_DEV_DEPLOY == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "chore/S15P31A305-37-server-environments")'

dev:plan:
  extends:
    - .linux-job
    - .dev-deployment-source
  stage: validate
  image: python:3.12-alpine
  timeout: 5m
  variables:
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git openssh-client
    - python infra/scripts/dev_pipeline.py plan
  artifacts:
    expire_in: 14 days
    paths:
      - dist/deployment/state.json
      - dist/deployment/plan.json
      - dist/deployment/dev-child.yml

dev:child:
  extends: .dev-deployment-source
  stage: verify
  needs:
    - ci:yaml
    - dev:plan
  interruptible: false
  resource_group: a305-dev-release
  trigger:
    include:
      - artifact: dist/deployment/dev-child.yml
        job: dev:plan
    strategy: depend

dev:deliver:
  extends: .docker-job
  stage: deploy
  image: docker:29.1.3-cli
  timeout: 30m
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache python3 git openssh-client
    - python3 infra/scripts/dev_pipeline.py deliver
  environment:
    name: development
    url: https://dev.elsehere.kr/
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dist/deployment/manifest.json
      - dist/deployment/result.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $A305_DEPLOY_CHILD == "true"'
