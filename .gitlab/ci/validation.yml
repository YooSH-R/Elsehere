ci:yaml:
  extends: .linux-job
  stage: validate
  image: python:3.13-alpine
  script:
    - |
      printf 'source=%s commit=%s target=%s diff_base=%s\n' "$CI_PIPELINE_SOURCE" "$CI_COMMIT_SHA" "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - pip install --disable-pip-version-check yamllint==1.37.1
    - yamllint -c .yamllint.yml .gitlab-ci.yml .gitlab/ci .yamllint.yml

infra:deployment-plan-tests:
  extends: .linux-job
  stage: validate
  image: python:3.12-alpine
  timeout: 5m
  script:
    - apk add --no-cache git
    - python -m pip install --disable-pip-version-check ruff==0.17.1
    - python -m ruff check infra/scripts --target-version py312
    - python -m ruff format --check infra/scripts --target-version py312
    - PYTHONPATH=infra/scripts python -m unittest discover -s infra/scripts/tests -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        compare_to: 'refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME'
        paths: &deployment_plan_change_paths
          - infra/scripts/**/*
          - .gitlab-ci.yml
          - .gitlab/ci/**/*
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      changes: *deployment_plan_change_paths

infra:app-runtime:
  extends: .docker-job
  stage: integration
  image: docker:29.1.3-cli
  timeout: 15m
  needs:
    - job: backend:check-and-build
      artifacts: true
  script:
    - apk add --no-cache python3
    - python3 infra/scripts/check_runtime.py --project "a305-check-$CI_JOB_ID" --tag "runtime-check-$CI_JOB_ID"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        compare_to: 'refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME'
        paths: &app_runtime_change_paths
          - .dockerignore
          - infra/docker/**/*
          - infra/compose/compose.app.yaml
          - infra/compose/compose.runtime-test.yaml
          - infra/compose/deploy.*.env.example
          - infra/nginx/web.conf
          - infra/scripts/check_runtime.py
          - infra/scripts/runtime_probe.py
          - docs/api/**/*
          - .gitlab-ci.yml
          - .gitlab/ci/**/*
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      changes: *app_runtime_change_paths

infra:compose-and-nginx:
  extends: .docker-job
  stage: validate
  image: docker:29.1.3-cli
  timeout: 10m
  script:
    - docker info
    - docker compose --env-file infra/compose/bootstrap.dev.env.example -f infra/compose/compose.bootstrap.yaml config --quiet
    - docker compose --env-file infra/compose/bootstrap.prod.env.example -f infra/compose/compose.bootstrap.yaml config --quiet
    # DinD has its own filesystem, so transfer config rather than mounting the job's path.
    - docker create --name nginx-proxy-check nginx:1.30.6-alpine nginx -t
    - docker cp infra/nginx/a305.bootstrap.conf nginx-proxy-check:/etc/nginx/conf.d/default.conf
    - docker start --attach nginx-proxy-check
    - test "$(docker inspect --format '{{.State.ExitCode}}' nginx-proxy-check)" = 0
    - |
      for environment in dev prod; do
        container="nginx-response-$environment"
        docker create --name "$container" --env "DEPLOYMENT_ENVIRONMENT=$environment" --env NGINX_ENVSUBST_TEMPLATE_DIR=/tmp nginx:1.30.6-alpine nginx -t
        docker cp infra/nginx/bootstrap-response.conf.template "$container":/tmp/default.conf.template
        docker start --attach "$container"
        test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      exists:
        - infra/compose/compose.bootstrap.yaml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      exists:
        - infra/compose/compose.bootstrap.yaml
      changes:
        compare_to: 'refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME'
        paths: &infra_change_paths
          - infra/compose/**/*
          - infra/nginx/**/*
          - .gitlab-ci.yml
          - .gitlab/ci/**/*
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      exists:
        - infra/compose/compose.bootstrap.yaml
      changes: *infra_change_paths
