ci:merge-conflicts:
  extends: .linux-light-job
  stage: .pre
  image: python:3.12-alpine
  timeout: 5m
  allow_failure: false
  variables:
    GIT_DEPTH: "0"
    GIT_CHECKOUT: "false"
    GIT_SUBMODULE_STRATEGY: none
  script:
    - apk add --no-cache git
    # Load only the checker from this candidate; do not check out Unity assets.
    - git show "${CI_COMMIT_SHA}:infra/scripts/check_merge_conflicts.py" > /tmp/a305-check-merge-conflicts.py
    - python /tmp/a305-check-merge-conflicts.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

ci:yaml:
  extends: .linux-light-job
  stage: validate
  image: python:3.13-alpine
  script:
    - |
      printf 'source=%s commit=%s target=%s diff_base=%s\n' "$CI_PIPELINE_SOURCE" "$CI_COMMIT_SHA" "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - pip install --disable-pip-version-check yamllint==1.37.1
    - yamllint -c .yamllint.yml .gitlab-ci.yml .gitlab/ci .yamllint.yml infra/monitoring infra/compose/compose.observability.yaml infra/compose/compose.dev-worker-network.yaml infra/compose/compose.prod-worker-network.yaml
    - python -m unittest discover -s infra/runner/tests -v

infra:deployment-plan-tests:
  extends: [.linux-light-job, .record-mr-success]
  stage: validate
  image: python:3.12-alpine
  timeout: 5m
  script:
    - apk add --no-cache git
    - python -m pip install --disable-pip-version-check ruff==0.17.1
    - python -m ruff check infra/scripts --target-version py312
    - python -m ruff format --check infra/scripts --target-version py312
    - PYTHONPATH=infra/scripts python -m unittest discover -s infra/scripts/tests -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $A305_CHECK_INFRA == "true"'
    - !reference [.deployment-parent-skips, rules]
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        compare_to: 'refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME'
        paths: &deployment_plan_change_paths
          - infra/scripts/**/*
          - infra/deploy/**/*
          - .gitlab-ci.yml
          - .gitlab/ci/**/*
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      changes: *deployment_plan_change_paths

infra:app-runtime:
  extends: [.docker-job, .record-mr-success]
  stage: integration
  image: docker:29.1.3-cli
  timeout: 15m
  needs:
    - job: backend:check-and-build
      artifacts: true
  script:
    - apk add --no-cache python3
    - python3 infra/scripts/check_runtime.py --project "a305-check-$CI_JOB_ID" --tag "runtime-check-$CI_JOB_ID"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $A305_CHECK_BACKEND == "true"'
    - !reference [.deployment-parent-skips, rules]
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        compare_to: 'refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME'
        paths: &app_runtime_change_paths
          - .dockerignore
          - infra/docker/**/*
          - infra/compose/compose.app.yaml
          - infra/compose/compose.runtime-test.yaml
          - infra/compose/deploy.*.env.example
          - infra/nginx/web.conf
          - infra/scripts/check_runtime.py
          - infra/scripts/docker_build.py
          - infra/scripts/runtime_probe.py
          - docs/api/**/*
          - .gitlab-ci.yml
          - .gitlab/ci/**/*
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      changes: *app_runtime_change_paths

infra:compose-and-nginx:
  extends: [.docker-job, .record-mr-success]
  stage: validate
  image: docker:29.1.3-cli
  timeout: 10m
  script:
    - docker info
    - docker compose --env-file infra/compose/bootstrap.dev.env.example -f infra/compose/compose.bootstrap.yaml config --quiet
    - docker compose --env-file infra/compose/bootstrap.prod.env.example -f infra/compose/compose.bootstrap.yaml config --quiet
    # DinD has its own filesystem, so transfer config rather than mounting the job's path.
    - docker create --name nginx-proxy-check nginx:1.30.6-alpine nginx -t
    - docker cp infra/nginx/a305.bootstrap.conf nginx-proxy-check:/etc/nginx/conf.d/default.conf
    - docker start --attach nginx-proxy-check
    - test "$(docker inspect --format '{{.State.ExitCode}}' nginx-proxy-check)" = 0
    - |
      for environment in dev prod; do
        container="nginx-response-$environment"
        docker create --name "$container" --env "DEPLOYMENT_ENVIRONMENT=$environment" --env NGINX_ENVSUBST_TEMPLATE_DIR=/tmp nginx:1.30.6-alpine nginx -t
        docker cp infra/nginx/bootstrap-response.conf.template "$container":/tmp/default.conf.template
        docker start --attach "$container"
        test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
      done
    - |
      mkdir -p dist
      {
        printf 'server { listen 80; server_name k15a305.p.ssafy.io;\n'
        cat infra/nginx/a305.dev-webgl.locations.conf
        printf '\n}\n'
      } > dist/a305-dev-webgl-check.conf
    - docker create --name nginx-webgl-route-check nginx:1.30.6-alpine nginx -t
    - docker cp dist/a305-dev-webgl-check.conf nginx-webgl-route-check:/etc/nginx/conf.d/default.conf
    - docker start --attach nginx-webgl-route-check
    - test "$(docker inspect --format '{{.State.ExitCode}}' nginx-webgl-route-check)" = 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $A305_CHECK_INFRA == "true"'
    - !reference [.deployment-parent-skips, rules]
    - if: '$CI_PIPELINE_SOURCE == "web"'
      exists:
        - infra/compose/compose.bootstrap.yaml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      exists:
        - infra/compose/compose.bootstrap.yaml
      changes:
        compare_to: 'refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME'
        paths: &infra_change_paths
          - infra/compose/**/*
          - infra/nginx/**/*
          - .gitlab-ci.yml
          - .gitlab/ci/**/*
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      exists:
        - infra/compose/compose.bootstrap.yaml
      changes: *infra_change_paths

infra:observability:
  extends: [.docker-job, .record-mr-success]
  stage: validate
  image: docker:29.1.3-cli
  timeout: 10m
  script:
    - apk add --no-cache python3
    - python3 infra/scripts/check_observability.py
    - python3 infra/scripts/check_alerting.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && ($A305_CHECK_BACKEND == "true" || $A305_CHECK_INFRA == "true")'
    - !reference [.deployment-parent-skips, rules]
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        compare_to: 'refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME'
        paths: &observability_change_paths
          - infra/monitoring/**/*
          - infra/compose/compose.observability.yaml
          - infra/nginx/**/*
          - infra/scripts/check_observability.py
          - infra/scripts/traffic_probe.py
          - infra/scripts/check_alerting.py
          - .gitlab-ci.yml
          - .gitlab/ci/**/*
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      changes: *observability_change_paths
