[tool.ruff]
required-version = "==0.17.1"
line-length = 140
target-version = "py312"
include = ["*.py", "*.pyi"]
# Generated code is not linted (docs/code-conventions.md); test_npc_profile_models.py checks it matches the generator.
extend-exclude = ["**/worker/app/npc_profile_models.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "conftest", "feedback"]

[tool.ruff.lint.per-file-ignores]
# These entry points add the sibling package path before importing it.
"**/worker/app/feedback_bridge.py" = ["E402"]
"**/tools/llm_latency.py" = ["E402"]
"**/tools/guard_eval.py" = ["E402"]
"**/guard/train_lora.py" = ["E402"]
"**/npc_reply/build_data.py" = ["E402"]
"**/npc_reply/make_sets.py" = ["E402"]
# Pins the shared GPU server to our GPU before onnxruntime is imported.
"**/gpu_tts/server.py" = ["E402"]

[tool.ruff.format]
line-ending = "lf"
