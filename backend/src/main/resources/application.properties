spring.application.name=elsehere

# 로컬 실행용 .env(backend/.env 또는 저장소 루트 .env)가 있으면 KEY=값 형식으로 읽는다. 같은 이름의 OS 환경변수가 우선한다.
# 서버 컨테이너에는 .env가 없으므로 값은 Compose의 environment로 넘긴다.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# 기본은 루프백 전용이다. 컨테이너에서는 내부 네트워크 사용을 명시하고 이 포트를 게시하지 않는다.
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}
management.server.port=${MANAGEMENT_PORT:9090}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
monitoring.password=${MONITORING_PASSWORD:}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
logging.pattern.level=%5p [request_id=%X{requestId:-none}]

# 로컬 실행용 DB 연결. 값은 환경변수로 덮어쓴다. 테스트는 Testcontainers가 연결 정보를 넣는다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/elsehere}
spring.datasource.username=${DB_USERNAME:elsehere}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false

# 로그인 상태는 서버 세션에 두고 세션 쿠키로 식별한다. 다른 사이트에서 보내는 POST에는 쿠키가 실리지 않도록 SameSite=Lax로 둔다.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# 소셜 로그인을 마친 뒤 돌아갈 클라이언트(Unity Web) 주소. 운영은 같은 출처의 첫 화면이다.
elsehere.client-url=${CLIENT_URL:/}

# Google 로그인. 클라이언트 ID·시크릿은 환경변수나 로컬 .env로 받는다.
# 값이 없어도 서버는 뜨지만(개발용 로그인만 쓰는 경우) Google 로그인은 실패한다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/v1/auth/callback/{registrationId}

# nginx 뒤에서 실행될 때 X-Forwarded-* 헤더로 원래 주소(https, 도메인)를 알아내 로그인 콜백 주소를 만든다.
server.forward-headers-strategy=native

# 스키마는 Flyway가 db/migration의 SQL로 만들고 바꾼다. JPA는 엔티티와 맞는지 검사만 한다.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
# Flyway 도입 전에 ddl-auto=update로 만든 DB(이력 테이블 없음)는 V1 상태로 인정하고 V2부터 적용한다.
spring.flyway.baseline-on-migrate=true

# AI 워커. 같은 서버의 별도 컨테이너이며 외부에 열지 않는다. 주소 이름은 인프라 Compose(AI_WORKER_BASE_URL)에 맞추고, 토큰은 워커의 AI_WORKER_TOKEN과 같은 값이다.
elsehere.ai-worker.url=${AI_WORKER_BASE_URL:http://localhost:8020}
elsehere.ai-worker.token=${AI_WORKER_TOKEN:}
# NPC 음성 파일(턴 전체 음성) 보관 폴더. 배포에서는 컨테이너 밖 볼륨으로 둔다.
elsehere.npc-audio.dir=${NPC_AUDIO_DIR:./data/npc-audio}
# 보관 정책(docs/npc-audio-storage.md): 턴 생성 후 최대 30일, 환경 전체 5,000,000,000바이트. 정리는 매일 04:00(Asia/Seoul)
elsehere.npc-audio.retention-days=${NPC_AUDIO_RETENTION_DAYS:30}
elsehere.npc-audio.max-bytes=${NPC_AUDIO_MAX_BYTES:5000000000}
elsehere.npc-audio.cleanup-cron=${NPC_AUDIO_CLEANUP_CRON:0 0 4 * * *}
# 녹음은 3MB까지 받는다. 그보다 조금 크게 열어 두고 넘으면 서버가 AUDIO_TOO_LARGE로 거절한다.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
