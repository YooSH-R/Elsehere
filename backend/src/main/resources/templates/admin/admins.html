<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('관리자')}"></head>
<body>
<header th:replace="~{admin/layout :: header}"></header>
<main>
  <h1>관리자</h1>
  <p class="hint">어드민을 쓸 수 있는 사람입니다. 추가하거나 해제하면 다시 로그인하지 않아도 바로 적용됩니다.</p>

  <div class="panel">
    <form id="grant-form" th:data-url="@{/api/v1/admin/admins}">
      <label for="email">관리자 추가</label>
      <p class="field-hint">게임에 Google로 가입한 이메일을 적습니다. 아직 가입하지 않았거나 게스트로만 시작한 사람은 추가할 수 없습니다.</p>
      <div class="inline">
        <input type="email" id="email" name="email" maxlength="255" required placeholder="name@gmail.com">
        <button type="submit" class="primary" id="grant">추가</button>
      </div>
    </form>
    <p id="status" class="status" role="status"></p>
  </div>

  <h2>지금 관리자</h2>
  <table>
    <thead>
    <tr>
      <th>닉네임</th>
      <th>Google 이메일</th>
      <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="admin : ${admins}">
      <td th:text="${admin.nickname}">Sun</td>
      <td th:text="${admin.email}">sun@example.com</td>
      <td>
        <span th:if="${admin.userId == currentUserId}" class="muted">나</span>
        <button th:unless="${admin.userId == currentUserId}" type="button" class="revoke"
                th:data-url="@{/api/v1/admin/admins/{id}(id=${admin.userId})}"
                th:data-nickname="${admin.nickname}">해제</button>
      </td>
    </tr>
    </tbody>
  </table>
</main>
<script>
  const form = document.getElementById("grant-form");
  const grantButton = document.getElementById("grant");
  const status = document.getElementById("status");

  function showStatus(message, kind) {
    status.textContent = message;
    status.className = "status " + kind;
  }

  async function failureMessage(response, fallback) {
    const body = await response.json().catch(() => null);
    const message = body && body.error ? body.error.message : fallback;
    return message + " (" + response.status + ")";
  }

  form.addEventListener("input", () => showStatus("", ""));

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    grantButton.disabled = true;
    showStatus("추가하는 중…", "");
    try {
      const response = await fetch(form.dataset.url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Requested-With": "ElsehereAdmin" },
        credentials: "same-origin",
        body: JSON.stringify({ email: form.email.value })
      });
      if (response.ok) {
        location.reload();
        return;
      }
      showStatus(await failureMessage(response, "추가하지 못했습니다."), "error");
    } catch (error) {
      showStatus("서버에 연결하지 못했습니다. 잠시 후 다시 추가해 주세요.", "error");
    } finally {
      grantButton.disabled = false;
    }
  });

  document.querySelectorAll("button.revoke").forEach((button) => {
    button.addEventListener("click", async () => {
      if (!confirm(button.dataset.nickname + " 님을 관리자에서 해제할까요?")) {
        return;
      }
      button.disabled = true;
      try {
        const response = await fetch(button.dataset.url, {
          method: "DELETE",
          headers: { "X-Requested-With": "ElsehereAdmin" },
          credentials: "same-origin"
        });
        if (response.ok) {
          location.reload();
          return;
        }
        showStatus(await failureMessage(response, "해제하지 못했습니다."), "error");
      } catch (error) {
        showStatus("서버에 연결하지 못했습니다. 잠시 후 다시 해제해 주세요.", "error");
      } finally {
        button.disabled = false;
      }
    });
  });
</script>
</body>
</html>
