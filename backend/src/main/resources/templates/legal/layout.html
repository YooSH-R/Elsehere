<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- 약관 문서가 함께 쓰는 머리글과 꼬리글. 가입 화면에서 새 창으로 연다. -->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · Elsehere'">Elsehere</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1f2328;
      --muted: #656d76;
      --line: #d8dee4;
      --accent: #2f6fde;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.7 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    article {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px 20px;
    }
    article > header { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .brand { margin: 0 0 4px; color: var(--muted); font-weight: 700; }
    h1 { margin: 0 0 4px; font-size: 24px; line-height: 1.4; }
    h2 { margin: 28px 0 8px; font-size: 18px; }
    .meta { margin: 0 0 4px; color: var(--muted); font-size: 14px; }
    p, ul { margin: 0 0 12px; }
    ul { padding-left: 20px; }
    li { margin-bottom: 4px; }
    .table-wrap { overflow-x: auto; margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { padding: 8px 10px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: var(--bg); font-weight: 600; }
    a { color: var(--accent); }
    footer { margin-top: 20px; color: var(--muted); font-size: 14px; }
    footer nav { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 8px; }
  </style>
</head>
<body>
<header th:fragment="header(title)">
  <p class="brand">Elsehere</p>
  <h1 th:text="${title}">약관</h1>
  <p class="meta" th:text="'버전 ' + ${version}">버전</p>
  <p class="meta">이 창을 닫으면 게임으로 돌아갑니다.</p>
</header>
<footer th:fragment="footer">
  <nav>
    <a th:href="@{${termsUrl}}">서비스 이용약관</a>
    <a th:href="@{${privacyUrl}}">개인정보 처리방침</a>
    <a th:href="@{${voiceUrl}}">음성 처리 동의</a>
    <a th:href="@{${aiTrainingUrl}}">AI 개선 데이터 활용</a>
  </nav>
  운영: SSAFY 15기 A305 팀
</footer>
</body>
</html>
