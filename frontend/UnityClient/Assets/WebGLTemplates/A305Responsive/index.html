<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Elsehere</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <section id="analytics-consent" class="analytics-consent" aria-labelledby="analytics-consent-title" hidden>
      <h2 id="analytics-consent-title">서비스 이용 통계 수집</h2>
      <p>서비스 개선을 위해 방문 화면, 게임 로딩 결과, 기기·브라우저, 대략적인 위치와 유입 경로를 Google 애널리틱스로 수집하고 있습니다. 원하지 않으면 [수집 거부]를 눌러 주세요. 거부해도 서비스를 이용할 수 있습니다.</p>
      <p><a href="/privacy" target="_blank" rel="noopener noreferrer">개인정보 처리방침 보기</a></p>
      <div class="analytics-consent-actions">
        <button id="analytics-reject" type="button">수집 거부</button>
        <button id="analytics-accept" type="button">수집 허용</button>
      </div>
    </section>
    <button id="analytics-settings" class="analytics-settings" type="button" hidden>통계 수집 설정</button>
    <main id="unity-viewport">
      <div id="unity-frame">
        <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1" aria-label="Elsehere"></canvas>
        <div id="unity-loading">
          <div id="intro-slides" aria-hidden="true"></div>
          <p id="intro-brand"><img src="logo.png" alt="Elsehere" width="660" height="128"></p>
          <div id="intro-footer">
            <p id="intro-caption"></p>
            <div id="loading-status" role="status">
              <span>마을을 불러오는 중이에요.</span>
              <div id="unity-progress" role="progressbar" aria-label="불러온 정도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
            </div>
          </div>
        </div>
        <div id="unity-warning" role="alert" hidden></div>
      </div>
    </main>
    <script id="analytics-script">
      (() => {
        const measurementId = "G-209TJ3SH81";
        const productionHosts = ["elsehere.kr", "www.elsehere.kr"];
        if (!measurementId || !productionHosts.includes(window.location.hostname)) {
          return;
        }

        const consentKey = "elsehere.analytics.consent";
        const consentPanel = document.getElementById("analytics-consent");
        const settingsButton = document.getElementById("analytics-settings");
        // Analytics runs by default; visitors can refuse it, and a saved refusal ("denied") stays in effect.
        let consent = null;
        let analyticsStarted = false;
        try {
          consent = window.localStorage.getItem(consentKey);
        } catch (error) {
          // If browser storage is unavailable, measure by default and show the notice again on the next visit.
        }

        function startAnalytics() {
          window["ga-disable-" + measurementId] = false;
          if (analyticsStarted) {
            return;
          }
          analyticsStarted = true;
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () {
            window.dataLayer.push(arguments);
          };
          let pageReferrer = "";
          try {
            const referrer = new URL(document.referrer);
            if (["http:", "https:"].includes(referrer.protocol)) {
              pageReferrer = referrer.origin + "/";
            }
          } catch (error) {
            // Direct visits have no referrer; omit malformed referrers too.
          }
          window.gtag("js", new Date());
          window.gtag("config", measurementId, {
            allow_google_signals: false,
            allow_ad_personalization_signals: false,
            page_location: window.location.origin + "/",
            page_referrer: pageReferrer,
          });
          const script = document.createElement("script");
          script.async = true;
          script.src =
            "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(measurementId);
          document.head.appendChild(script);
        }

        function saveConsent(value) {
          try {
            window.localStorage.setItem(consentKey, value);
            return true;
          } catch (error) {
            try {
              window.localStorage.removeItem(consentKey);
              return true;
            } catch (storageError) {
              // A temporary choice still applies to the current page.
              return false;
            }
          }
        }

        function clearAnalyticsCookies() {
          const cookieNames = ["_ga", "_ga_" + measurementId.substring(2)];
          for (const name of cookieNames) {
            const expired =
              name + "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax; Secure";
            document.cookie = expired;
            document.cookie = expired + "; domain=.elsehere.kr";
          }
        }

        window.reportUnityLoad = (status, detail) => {
          let event;
          if (status === "loaded" && Number.isFinite(detail) && detail >= 0) {
            event = { name: "webgl_loaded", parameters: { duration_seconds: detail } };
          } else if (status === "failed" && ["loader", "initialization"].includes(detail)) {
            event = { name: "webgl_load_failed", parameters: { failure_stage: detail } };
          } else {
            return;
          }
          if (consent !== "denied" && analyticsStarted) {
            window.gtag("event", event.name, event.parameters);
          }
        };

        settingsButton.hidden = false;
        consentPanel.hidden = consent === "granted" || consent === "denied";
        document.getElementById("analytics-accept").addEventListener("click", () => {
          saveConsent("granted");
          consent = "granted";
          consentPanel.hidden = true;
          startAnalytics();
        });
        document.getElementById("analytics-reject").addEventListener("click", () => {
          window["ga-disable-" + measurementId] = true;
          if (window.dataLayer) {
            window.dataLayer.length = 0;
          }
          const saved = saveConsent("denied");
          consent = "denied";
          clearAnalyticsCookies();
          consentPanel.hidden = true;
          if (analyticsStarted && saved) {
            window.location.reload();
          }
        });
        settingsButton.addEventListener("click", () => {
          consentPanel.hidden = false;
        });
        if (consent !== "denied") {
          startAnalytics();
        }
      })();
    </script>
    <script id="extension-error-filter">
      // MetaMask 같은 브라우저 확장 프로그램이 페이지에 넣은 스크립트의 오류는 게임 오류가 아니다.
      // Unity 로더는 창에서 난 오류를 모두 받아, 불러오는 중이면 로딩 실패로, 그 뒤에는 오류 창(alert)으로 알린다.
      // 로더보다 먼저 같은 이벤트를 받아 확장 프로그램 오류만 로더에 넘기지 않는다. 기본 동작은 막지 않아 브라우저 콘솔에는 남는다.
      (() => {
        // 크롬 계열, 파이어폭스, 사파리가 확장 프로그램 스크립트에 붙이는 주소다.
        const extensionScriptPattern = /(?:chrome|moz|safari-web)-extension:\/\//;

        // 크롬은 호출 기록 맨 앞에 오류 문구를 두고, 호출 위치는 "at "으로 시작하는 줄에 적는다.
        function firstStackFrame(stack) {
          for (const line of stack.split("\n")) {
            const frame = line.trim();
            if (frame.startsWith("at ")) {
              return frame;
            }
          }
          return "";
        }

        // 오류가 난 파일은 Unity 로더와 같은 순서로 찾는다. 크롬은 처리하지 않은 거부(unhandledrejection)에 파일을 알려 주지 않아 호출 기록을 본다.
        function isBrowserExtensionError(event) {
          const error = event.error ?? event.reason;
          const fileName = event.filename || error?.fileName || error?.sourceURL;
          if (fileName) {
            return extensionScriptPattern.test(fileName);
          }
          const stack = typeof error?.stack === "string" ? error.stack : "";
          return extensionScriptPattern.test(firstStackFrame(stack));
        }

        function keepFromUnityLoader(event) {
          if (isBrowserExtensionError(event)) {
            event.stopImmediatePropagation();
          }
        }

        window.addEventListener("error", keepFromUnityLoader);
        window.addEventListener("unhandledrejection", keepFromUnityLoader);
      })();
    </script>
    <script id="entry-music">
      // 게임 파일을 받는 로딩 화면에서부터 접속 음악을 튼다. 브라우저가 자동재생을 막으면 첫 클릭·키·터치 뒤에 들린다.
      // Unity가 켜지면 InterfaceAudioPlayer가 이 음악을 이어받아(LoadingPageMusic.jslib) 입구 화면에서도 끊지 않고 틀고,
      // 게임 공간에 들어가면 줄여서 끈다. 음량 0.18은 Unity의 EntryMusicPlan과 같다.
      // Unity 로더는 처리하지 않은 Promise 거부를 로딩 실패로 알리므로, 여기의 Promise는 모두 거부를 직접 처리한다.
      (() => {
        if (!window.AudioContext) {
          return;
        }
        // 스피커를 끈 선택은 Unity가 Set으로 알려 줄 때 남긴다. 저장소를 읽지 못하면 켠 것으로 본다.
        const soundKey = "elsehere.audio.background.enabled";
        let soundEnabled = true;
        try {
          soundEnabled = localStorage.getItem(soundKey) !== "0";
        } catch {
          // 저장소를 쓸 수 없으면 기본값(켬)으로 튼다.
        }

        // iPhone Safari는 audio 요소의 음량을 바꿀 수 없어, 받은 음원을 Web Audio로 반복해 틀고 음량은 gain으로 정한다.
        const context = new AudioContext();
        const gain = context.createGain();
        gain.gain.value = soundEnabled ? 0.18 : 0;
        gain.connect(context.destination);
        let shouldPlay = soundEnabled;
        let failed = false;
        let buffer = null;
        let source = null;

        function startLoop() {
          if (!shouldPlay || source !== null || buffer === null) {
            return;
          }
          source = context.createBufferSource();
          source.buffer = buffer;
          source.loop = true;
          source.connect(gain);
          source.start();
        }

        function stopLoop() {
          if (source === null) {
            return;
          }
          source.stop();
          source.disconnect();
          source = null;
        }

        fetch("entry-town-ensemble.mp3")
          .then((response) => {
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }
            return response.arrayBuffer();
          })
          .then((data) => context.decodeAudioData(data))
          .then((decoded) => {
            buffer = decoded;
            startLoop();
          })
          .catch((error) => {
            // 음악 없이도 게임은 열린다. Unity는 음악이 없는 페이지 대신 자기 음악을 쓴다.
            failed = true;
            console.warn("접속 음악을 불러오지 못했습니다.", error);
          });

        // 자동재생이 막히면 소리가 멈춘 채로 시작한다. 클릭·키·터치 때마다 다시 켠다(iPhone은 전화·알림 뒤에도 멈춘다).
        function resumeOnGesture() {
          if (context.state !== "running") {
            context.resume().catch((error) => console.warn("접속 음악을 켜지 못했습니다.", error));
          }
        }
        for (const type of ["pointerdown", "pointerup", "touchend", "keydown", "click"]) {
          window.addEventListener(type, resumeOnGesture, { capture: true, passive: true });
        }

        window.elsehereEntryMusic = {
          // 음원을 받지 못했으면 -1을 돌려준다. Unity는 이때 자기 음악을 쓴다.
          volume: () => (failed ? -1 : gain.gain.value),
          set(volume, playing, enabled) {
            gain.gain.value = volume;
            shouldPlay = playing;
            if (playing) {
              startLoop();
            } else {
              stopLoop();
            }
            if (enabled !== soundEnabled) {
              soundEnabled = enabled;
              try {
                localStorage.setItem(soundKey, enabled ? "1" : "0");
              } catch {
                // 저장하지 못하면 다음 로딩 화면은 이 선택을 모른 채 기본값으로 튼다.
              }
            }
          },
        };
      })();
    </script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#unity-loading");
      const warning = document.querySelector("#unity-warning");

      // 게임 화면에서 오른쪽 클릭으로 브라우저 메뉴가 떠 화면을 가리지 않게 한다.
      canvas.addEventListener("contextmenu", (event) => event.preventDefault());

      // 게임 파일을 받는 동안 소개 그림(1536x1024)을 한 장씩 보여 준다.
      const introSlides = [
        { image: "intro/feature-hover.jpg", caption: "사물을 가리키면 단어와 예문을 알려 줘요" },
        { image: "intro/feature-talk.jpg", caption: "NPC에게 말을 걸면 대답해 줘요" },
        { image: "intro/feature-shop.jpg", caption: "가게에서 필요한 물건이 어디 있는지 물어봐요" },
        { image: "intro/feature-directions.jpg", caption: "길을 모르면 마을 사람에게 물어봐요" },
        { image: "intro/feature-vocabulary.jpg", caption: "저장한 단어는 나만의 단어장에 모여요" },
        { image: "intro/feature-relationship.jpg", caption: "다시 찾아가면 NPC가 나를 알아보고 반겨 줘요" },
        { image: "intro/feature-greeting.jpg", caption: "다시 만나면 오늘 하루가 어땠는지 물어봐 줘요" },
      ];
      // 로딩이 10초 남짓이어도 서너 장은 보이도록 짧게 바꾼다. 장면이 겹쳐 바뀌는 시간은 style.css의 .intro-slide에 있다.
      const slideDurationMs = 3000;
      const slidesElement = document.querySelector("#intro-slides");
      const captionElement = document.querySelector("#intro-caption");
      let introRunning = true;
      let slideTimer = 0;

      // 접속할 때마다 순서를 섞는다. 로딩이 짧으면 첫 장면만 보일 수 있어, 지난 접속의 첫 장면은 첫 자리에 두지 않는다.
      // 브라우저 저장소를 쓸 수 없으면 지난 접속을 모르는 채로 섞기만 한다.
      const lastFirstSlideKey = "elsehere.intro.lastFirstSlide";

      function shuffleIntro(slides) {
        const order = slides.slice();
        for (let index = order.length - 1; index > 0; index--) {
          const other = Math.floor(Math.random() * (index + 1));
          [order[index], order[other]] = [order[other], order[index]];
        }

        let lastFirst = null;
        try {
          lastFirst = localStorage.getItem(lastFirstSlideKey);
        } catch {
          // 저장소를 읽지 못하면 지난 첫 장면을 피하지 않는다.
        }
        if (order.length > 1 && order[0].image === lastFirst) {
          const other = 1 + Math.floor(Math.random() * (order.length - 1));
          [order[0], order[other]] = [order[other], order[0]];
        }
        try {
          localStorage.setItem(lastFirstSlideKey, order[0].image);
        } catch {
          // 저장하지 못하면 다음 접속은 이번 첫 장면을 피하지 않는다.
        }
        return order;
      }

      // 장면 하나는 흐린 배경과 그 위 가운데 카드로 그린다. 받지 못한 장면은 null이 되어 건너뛴다.
      function prepareSlide(slide) {
        const element = document.createElement("div");
        element.className = "intro-slide";
        const backdrop = new Image();
        backdrop.className = "intro-backdrop";
        backdrop.alt = "";
        backdrop.src = slide.image;
        const frame = document.createElement("div");
        frame.className = "intro-frame";
        const picture = new Image();
        picture.className = "intro-picture";
        picture.alt = "";
        picture.src = slide.image;
        frame.appendChild(picture);
        element.append(backdrop, frame);
        return picture.decode().then(
          () => {
            // 카드는 사진 비율대로 크기를 잡는다.
            element.style.setProperty("--ratio", picture.naturalWidth / picture.naturalHeight);
            return element;
          },
          () => null
        );
      }

      async function playIntro(slides) {
        let current = null;
        let failedInRow = 0;
        let upcoming = prepareSlide(slides[0]);
        for (let index = 0; introRunning; index = (index + 1) % slides.length) {
          const slide = slides[index];
          const shown = await upcoming;
          // 지금 장면을 보여 주는 동안 다음 장면 이미지를 미리 받아 둔다.
          upcoming = prepareSlide(slides[(index + 1) % slides.length]);
          if (!introRunning) {
            return;
          }
          if (shown === null) {
            // 모든 장면을 받지 못하면 진행 막대만 남긴다.
            failedInRow++;
            if (failedInRow >= slides.length) {
              return;
            }
            continue;
          }
          failedInRow = 0;

          slidesElement.appendChild(shown);
          // 새 장면을 붙인 다음 프레임에 켜야 투명도 전환이 일어난다.
          requestAnimationFrame(() => shown.classList.add("is-active"));
          captionElement.textContent = slide.caption;
          if (current !== null) {
            const previous = current;
            previous.classList.remove("is-active");
            setTimeout(() => previous.remove(), 1000);
          }
          current = shown;

          await new Promise((resolve) => {
            slideTimer = setTimeout(resolve, slideDurationMs);
          });
        }
      }

      function stopIntro() {
        introRunning = false;
        clearTimeout(slideTimer);
      }

      // 막대가 받은 만큼 부드럽게 따라 차도록 값만 넘긴다. 차오르는 시간은 style.css의 #unity-progress span에 있다.
      const progressBar = document.querySelector("#unity-progress");

      function showProgress(progress) {
        progressBar.style.setProperty("--progress", progress);
        progressBar.setAttribute("aria-valuenow", Math.round(progress * 100));
      }

      // Unity는 파일을 다 받으면 0.9, 게임 준비를 마치면 1을 알린다. 마지막 칸은 hideLoading이 채운다.
      function showDownloadProgress(progress) {
        showProgress(Math.min(progress, 0.9));
      }

      // 게임 준비를 마친 직후 Unity가 첫 화면을 그리는 동안 브라우저 화면이 1초 남짓 멈춘다.
      // 화면이 다시 이어서 그려질 때 마무리를 시작해야 막대가 끝까지 차는 모습이 보인다. 느린 기기에서 붙잡지 않도록 2초가 지나면 그냥 시작한다.
      function whenFramesFlow(callback) {
        let started = 0;
        let previous = 0;
        let smoothFrames = 0;
        requestAnimationFrame(function check(now) {
          started ||= now;
          smoothFrames = previous && now - previous < 100 ? smoothFrames + 1 : 0;
          previous = now;
          if (smoothFrames >= 2 || now - started > 2000) {
            callback();
            return;
          }
          requestAnimationFrame(check);
        });
      }

      function hideLoading() {
        stopIntro();
        loading.style.pointerEvents = "none";
        whenFramesFlow(() => {
          // 막대가 끝까지 차는 모습을 보인 뒤 로딩 화면을 닫는다.
          showProgress(1);
          loading
            .animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, delay: 400, easing: "ease-out" })
            .finished.then(() => {
              loading.hidden = true;
            });
        });
      }

      function showBanner(message, type) {
        const entry = document.createElement("div");
        entry.textContent = message;
        warning.appendChild(entry);
        warning.hidden = false;
        if (type !== "error") {
          setTimeout(() => {
            entry.remove();
            warning.hidden = warning.children.length === 0;
          }, 5000);
        }
      }

      function showLoadError(message) {
        stopIntro();
        loading.hidden = true;
        showBanner(message, "error");
      }

      playIntro(shuffleIntro(introSlides));

      const buildUrl = "Build";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner,
      };

      const loadStartedAt = performance.now();
      const loader = document.createElement("script");
      loader.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      loader.onerror = () => {
        window.reportUnityLoad?.("failed", "loader");
        showLoadError("화면을 불러오지 못했습니다. 연결을 확인한 뒤 새로고침해 주세요.");
      };
      loader.onload = () => {
        createUnityInstance(canvas, config, showDownloadProgress).then(() => {
          hideLoading();
          const seconds = Math.round((performance.now() - loadStartedAt) / 10) / 100;
          window.reportUnityLoad?.("loaded", seconds);
        }).catch((error) => {
          window.reportUnityLoad?.("failed", "initialization");
          showLoadError(error);
        });
      };
      document.body.appendChild(loader);
    </script>
  </body>
</html>
