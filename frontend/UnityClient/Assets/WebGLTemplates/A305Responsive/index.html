<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Elsehere</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main id="unity-viewport">
      <div id="unity-frame">
        <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1" aria-label="Elsehere"></canvas>
        <div id="unity-loading">
          <div id="intro-slides" aria-hidden="true"></div>
          <p id="intro-brand">Elsehere</p>
          <div id="intro-footer">
            <p id="intro-caption"></p>
            <div id="loading-status" role="status">
              <span>마을을 불러오는 중이에요.</span>
              <progress id="unity-progress" max="1" value="0"></progress>
            </div>
          </div>
        </div>
        <div id="unity-warning" role="alert" hidden></div>
      </div>
    </main>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#unity-loading");
      const warning = document.querySelector("#unity-warning");

      // 게임 화면에서 오른쪽 클릭으로 브라우저 메뉴가 떠 화면을 가리지 않게 한다.
      canvas.addEventListener("contextmenu", (event) => event.preventDefault());

      // 게임 파일을 받는 동안 소개 그림을 한 장씩 보여 준다.
      // 그림은 frontend/design의 소개 그림(4칸·6칸)을 칸별로 잘라 모두 762x505로 맞춘다.
      const introSlides = [
        { image: "intro/feature-hover.jpg", caption: "사물을 가리키면 영어 단어와 예문을 알려 줘요" },
        { image: "intro/feature-discover.jpg", caption: "마음에 드는 단어는 바로 단어장에 저장해요" },
        { image: "intro/feature-talk.jpg", caption: "NPC에게 영어로 말을 걸면 대답해 줘요" },
        { image: "intro/feature-checkin.jpg", caption: "호텔 프런트에서 말로 체크인해 봐요" },
        { image: "intro/feature-shop.jpg", caption: "가게에서 필요한 물건이 어디 있는지 물어봐요" },
        { image: "intro/feature-directions.jpg", caption: "길을 모르면 마을 사람에게 물어봐요" },
        { image: "intro/feature-vocabulary.jpg", caption: "저장한 단어는 나만의 단어장에 모여요" },
        { image: "intro/feature-collect.jpg", caption: "오늘 만난 단어를 단어장에서 다시 봐요" },
        { image: "intro/feature-relationship.jpg", caption: "다시 찾아가면 NPC가 나를 알아보고 반겨 줘요" },
        { image: "intro/feature-greeting.jpg", caption: "다시 만나면 오늘 하루가 어땠는지 물어봐 줘요" },
      ];
      const slideDurationMs = 5000;
      const slidesElement = document.querySelector("#intro-slides");
      const captionElement = document.querySelector("#intro-caption");
      let introRunning = true;
      let slideTimer = 0;

      // 접속할 때마다 순서를 섞는다. 로딩이 짧으면 첫 장면만 보일 수 있어, 지난 접속의 첫 장면은 첫 자리에 두지 않는다.
      // 브라우저 저장소를 쓸 수 없으면 지난 접속을 모르는 채로 섞기만 한다.
      const lastFirstSlideKey = "elsehere.intro.lastFirstSlide";

      function shuffleIntro(slides) {
        const order = slides.slice();
        for (let index = order.length - 1; index > 0; index--) {
          const other = Math.floor(Math.random() * (index + 1));
          [order[index], order[other]] = [order[other], order[index]];
        }

        let lastFirst = null;
        try {
          lastFirst = localStorage.getItem(lastFirstSlideKey);
        } catch {
          // 저장소를 읽지 못하면 지난 첫 장면을 피하지 않는다.
        }
        if (order.length > 1 && order[0].image === lastFirst) {
          const other = 1 + Math.floor(Math.random() * (order.length - 1));
          [order[0], order[other]] = [order[other], order[0]];
        }
        try {
          localStorage.setItem(lastFirstSlideKey, order[0].image);
        } catch {
          // 저장하지 못하면 다음 접속은 이번 첫 장면을 피하지 않는다.
        }
        return order;
      }

      // 장면 하나는 흐린 배경과 그 위 가운데 카드로 그린다. 받지 못한 장면은 null이 되어 건너뛴다.
      function prepareSlide(slide) {
        const element = document.createElement("div");
        element.className = "intro-slide";
        const backdrop = new Image();
        backdrop.className = "intro-backdrop";
        backdrop.alt = "";
        backdrop.src = slide.image;
        const frame = document.createElement("div");
        frame.className = "intro-frame";
        const picture = new Image();
        picture.className = "intro-picture";
        picture.alt = "";
        picture.src = slide.image;
        frame.appendChild(picture);
        element.append(backdrop, frame);
        return picture.decode().then(
          () => {
            // 카드는 사진 비율대로 크기를 잡는다.
            element.style.setProperty("--ratio", picture.naturalWidth / picture.naturalHeight);
            return element;
          },
          () => null
        );
      }

      async function playIntro(slides) {
        let current = null;
        let failedInRow = 0;
        let upcoming = prepareSlide(slides[0]);
        for (let index = 0; introRunning; index = (index + 1) % slides.length) {
          const slide = slides[index];
          const shown = await upcoming;
          // 지금 장면을 보여 주는 동안 다음 장면 이미지를 미리 받아 둔다.
          upcoming = prepareSlide(slides[(index + 1) % slides.length]);
          if (!introRunning) {
            return;
          }
          if (shown === null) {
            // 모든 장면을 받지 못하면 진행 막대만 남긴다.
            failedInRow++;
            if (failedInRow >= slides.length) {
              return;
            }
            continue;
          }
          failedInRow = 0;

          slidesElement.appendChild(shown);
          // 새 장면을 붙인 다음 프레임에 켜야 투명도 전환이 일어난다.
          requestAnimationFrame(() => shown.classList.add("is-active"));
          captionElement.textContent = slide.caption;
          if (current !== null) {
            const previous = current;
            previous.classList.remove("is-active");
            setTimeout(() => previous.remove(), 1500);
          }
          current = shown;

          await new Promise((resolve) => {
            slideTimer = setTimeout(resolve, slideDurationMs);
          });
        }
      }

      function stopIntro() {
        introRunning = false;
        clearTimeout(slideTimer);
      }

      function hideLoading() {
        stopIntro();
        loading.style.pointerEvents = "none";
        loading
          .animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, easing: "ease-out" })
          .finished.then(() => {
            loading.hidden = true;
          });
      }

      function showBanner(message, type) {
        const entry = document.createElement("div");
        entry.textContent = message;
        warning.appendChild(entry);
        warning.hidden = false;
        if (type !== "error") {
          setTimeout(() => {
            entry.remove();
            warning.hidden = warning.children.length === 0;
          }, 5000);
        }
      }

      function showLoadError(message) {
        stopIntro();
        loading.hidden = true;
        showBanner(message, "error");
      }

      playIntro(shuffleIntro(introSlides));

      const buildUrl = "Build";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner,
      };

      const loader = document.createElement("script");
      loader.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      loader.onerror = () => showLoadError("화면을 불러오지 못했습니다. 연결을 확인한 뒤 새로고침해 주세요.");
      loader.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress").value = progress;
        }).then(hideLoading).catch(showLoadError);
      };
      document.body.appendChild(loader);
    </script>
  </body>
</html>
