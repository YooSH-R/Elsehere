# Merge with the reviewed app Compose file. Never publish port 9090 to the host.
services:
  backend:
    environment:
      MANAGEMENT_ADDRESS: 0.0.0.0
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:?Set an environment-specific monitoring password}
  web:
    volumes:
      - ${OBSERVABILITY_WEB_LOG_CONFIG:?Set the absolute web logging configuration path}:/etc/nginx/conf.d/00-observability.conf:ro
