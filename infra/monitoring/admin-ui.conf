# Publish only this proxy on loopback. Grafana and Alertmanager stay internally isolated.
access_log off;
error_log /var/log/nginx/error.log crit;
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $admin_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 3000;
    server_name localhost;
    set $grafana_address grafana:3000;

    location / {
        proxy_pass http://$grafana_address$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $admin_connection_upgrade;
    }
}

server {
    listen 9093;
    server_name localhost;
    set $alertmanager_address alertmanager:9093;

    location / {
        proxy_pass http://$alertmanager_address$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
}
