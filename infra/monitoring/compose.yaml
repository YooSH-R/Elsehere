x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  security_opt:
    - no-new-privileges:true
  group_add:
    - "${MONITORING_SECRET_GID:?Set the group ID that can read the secret files}"

services:
  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    secrets:
      - dev-monitoring-password
      - prod-monitoring-password
    networks:
      - monitoring
      - development
      - production
    cpus: 0.50
    mem_limit: 512m

  grafana:
    <<: *service-defaults
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets:
      - grafana-admin-password
    networks:
      - monitoring
    cpus: 0.50
    mem_limit: 256m

  alertmanager:
    <<: *service-defaults
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - monitoring
    cpus: 0.25
    mem_limit: 128m

  admin-ui:
    <<: *service-defaults
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9093:9093"
    volumes:
      - ./admin-ui.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - monitoring
      - admin-access
    cpus: 0.25
    mem_limit: 64m

  blackbox:
    <<: *service-defaults
    image: prom/blackbox-exporter:v0.29.1
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring
      - probe-egress
    cpus: 0.25
    mem_limit: 64m

networks:
  monitoring:
    internal: true
  development:
    external: true
    name: a305-dev_default
  production:
    external: true
    name: a305-prod_default
  probe-egress: {}
  admin-access: {}

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

secrets:
  dev-monitoring-password:
    file: ${MONITORING_SECRETS_DIRECTORY:?Set the server secret directory}/dev-monitoring-password
  prod-monitoring-password:
    file: ${MONITORING_SECRETS_DIRECTORY:?Set the server secret directory}/prod-monitoring-password
  grafana-admin-password:
    file: ${MONITORING_SECRETS_DIRECTORY:?Set the server secret directory}/grafana-admin-password
