global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: elsehere-api
    metrics_path: /actuator/prometheus
    basic_auth:
      username: monitoring
      password_file: /run/secrets/dev-monitoring-password
    static_configs:
      - targets: ["a305-dev-backend-1:9090"]
        labels:
          environment: dev
  - job_name: elsehere-api-prod
    metrics_path: /actuator/prometheus
    basic_auth:
      username: monitoring
      password_file: /run/secrets/prod-monitoring-password
    static_configs:
      - targets: ["a305-prod-backend-1:9090"]
        labels:
          environment: prod
