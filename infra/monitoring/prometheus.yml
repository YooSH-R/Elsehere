global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gitlab-runners
    scrape_timeout: 12s
    file_sd_configs:
      - files: ["/etc/prometheus/targets/runners.json"]
  - job_name: elsehere-api
    metrics_path: /actuator/prometheus
    basic_auth:
      username: monitoring
      password_file: /run/secrets/dev-monitoring-password
    file_sd_configs:
      - files: ["/etc/prometheus/targets/api-dev.json"]
  - job_name: elsehere-api-prod
    metrics_path: /actuator/prometheus
    basic_auth:
      username: monitoring
      password_file: /run/secrets/prod-monitoring-password
    file_sd_configs:
      - files: ["/etc/prometheus/targets/api-prod.json"]
  - job_name: https-probe
    metrics_path: /probe
    params:
      module: [https_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/https.json"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
