server {
    listen 80;
    server_name localhost;
    include /etc/nginx/a305-observability-server.conf;
    include /etc/nginx/a305-traffic-protection-server.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/upload {
        set $app_web_address app-web:80;
        proxy_pass http://$app_web_address$request_uri;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
    location /unavailable/ {
        proxy_pass http://127.0.0.1:1;
    }
}

server {
    listen 8080;
    # The private stub must not hide which proxy rejects an oversized request.
    client_max_body_size 0;
    access_log off;
    location / {
        default_type application/json;
        return 200 '{"request_id":"$http_x_request_id"}';
    }
    location /api/failure {
        return 500;
    }
}
