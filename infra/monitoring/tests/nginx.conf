# Low fixture budgets exercise rejection with a few local requests, not public load.
limit_req_zone $a305_api_client_key zone=a305_fixture_rate:1m rate=1r/s;
limit_conn_zone $a305_api_client_key zone=a305_fixture_connections:1m;

server {
    listen 80;
    server_name localhost;
    include /etc/nginx/a305-observability-server.conf;
    include /etc/nginx/a305-traffic-protection-server.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/upload {
        set $app_web_address app-web:80;
        proxy_pass http://$app_web_address$request_uri;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
    location /unavailable/ {
        proxy_pass http://127.0.0.1:1;
    }
}

server {
    listen 8080;
    # The private stub must not hide which proxy rejects an oversized request.
    client_max_body_size 0;
    access_log off;
    location / {
        default_type application/json;
        return 200 '{"request_id":"$http_x_request_id","content_length":"$http_content_length"}';
    }
    location /api/failure {
        return 500;
    }
    location = /api/upstream429 {
        default_type application/json;
        return 429 '{"error":{"code":"UPSTREAM_FIXTURE_LIMIT"}}';
    }
}

server {
    listen 8083;
    include /etc/nginx/a305-observability-server.conf;
    include /etc/nginx/a305-traffic-protection-server.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/rate {
        include /etc/nginx/a305-traffic-dev-mode.conf;
        limit_req zone=a305_fixture_rate burst=1 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location /api/observe {
        limit_req zone=a305_fixture_rate burst=1 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location /api/hold {
        include /etc/nginx/a305-traffic-dev-mode.conf;
        limit_conn a305_fixture_connections 1;
        set $hold_backend traffic-probe:8088;
        proxy_pass http://$hold_backend$request_uri;
    }
    location /api/restore-hold {
        include /etc/nginx/a305-traffic-dev-mode.conf;
        limit_conn a305_fixture_connections 1;
        set $restore_backend traffic-restore:8088;
        proxy_pass http://$restore_backend$request_uri;
    }
    location /api/upstream429 {
        proxy_pass http://127.0.0.1:8080;
    }
}
