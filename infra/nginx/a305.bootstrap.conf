# Initial HTTP configuration. Preserve Certbot's TLS settings on an existing server.
server {
    listen 80;
    listen [::]:80;
    server_name k15a305.p.ssafy.io;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = / {
        default_type text/plain;
        return 200 'A305 deployment infrastructure is ready.\n';
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /dev/api {
        return 308 /dev/api/;
    }

    location /dev/api/ {
        proxy_pass http://127.0.0.1:8081/api/;
    }

    location / {
        return 404;
    }
}
