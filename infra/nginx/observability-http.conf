# Install in /etc/nginx/conf.d/; this file belongs to the http context.
map $uri $a305_environment {
    default prod;
    ~^/dev(?:/|$) dev;
}

# Log route groups rather than raw URLs, which may contain OAuth codes or user data.
map $uri $a305_log_route {
    default /unmatched;
    / /;
    /api/health /api/health;
    /dev/api/health /api/health;
    ~^/(?:dev/)?api/v1/auth/ /api/v1/auth/**;
    ~^/(?:dev/)?api/ /api/**;
    ~^/dev(?:/|$) /webgl/**;
}

log_format a305_request escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"environment":"$a305_environment","method":"$request_method",'
    '"route":"$a305_log_route","status":$status,"duration_seconds":$request_time}';
