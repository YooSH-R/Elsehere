# Include inside each A305 HTTP/HTTPS server block, preserving existing TLS settings.
access_log /var/log/nginx/access.log a305_request;
# Routine upstream failures are recorded by status in the safe access log.
# Native error messages cannot redact request URLs, so keep only critical diagnostics.
error_log /var/log/nginx/error.log crit;

# Replace client-supplied IDs at the public entry point. Inner proxies pass this header on.
proxy_set_header X-Request-ID $request_id;
proxy_hide_header X-Request-ID;
add_header X-Request-ID $request_id always;
