# Observation candidates, not validated production capacity. Install in http context.
# Keep aliases of the same environment in one budget; never trust a supplied XFF key.
map "$a305_environment:$uri" $a305_api_client_key {
    default "";
    ~^(dev|prod):/(?:dev/)?api/ "$a305_environment:$binary_remote_addr";
}

map "$a305_environment:$uri" $a305_api_environment_key {
    default "";
    ~^(dev|prod):/(?:dev/)?api/ $a305_environment;
}

limit_req_zone $a305_api_client_key zone=a305_api_client_rate:10m rate=120r/s;
limit_req_zone $a305_api_environment_key zone=a305_api_environment_rate:1m rate=240r/s;
limit_conn_zone $a305_api_client_key zone=a305_api_client_connections:10m;
limit_conn_zone $a305_api_environment_key zone=a305_api_environment_connections:1m;
