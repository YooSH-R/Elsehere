# Include only in the app's HTTPS server blocks, preserving TLS and observability.
# Observe first. Enforcement needs shared-IP, upload and long-response validation.
limit_req_dry_run on;
limit_conn_dry_run on;

limit_req zone=a305_api_client_rate burst=512 nodelay;
limit_req zone=a305_api_environment_rate burst=1024 nodelay;
limit_conn a305_api_client_connections 100;
limit_conn a305_api_environment_connections 200;
limit_req_status 429;
limit_conn_status 429;

# Keep upstream 429 responses intact; this page handles local Nginx rejections.
proxy_intercept_errors off;
error_page 429 = @a305_request_limited;
location @a305_request_limited {
    default_type application/json;
    return 429 '{"error":{"code":"TOO_MANY_REQUESTS","message":"Too many requests. Please try again later."}}';
}
