server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend after Compose replaces its container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_address backend:8080;

    location /api/ {
        # Keep the proxy from rejecting audio allowed by Spring's multipart limit.
        client_max_body_size 5m;
        proxy_pass http://$backend_address$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Operator admin pages are rendered by the backend (docs/admin.md).
    # ^~ keeps the WebGL regex locations below from catching admin paths.
    location ^~ /admin {
        proxy_pass http://$backend_address$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /version.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~ \.wasm\.gz$ {
        gzip off;
        default_type application/wasm;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }

    location ~ \.js\.gz$ {
        gzip off;
        default_type application/javascript;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }

    location ~ \.data\.gz$ {
        gzip off;
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }

    location ~ \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    location / {
        # Revalidate the entry page so it points to the current hashed build files.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
