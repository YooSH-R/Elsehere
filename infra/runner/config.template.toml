# Apply these limits to the two entries produced by `gitlab-runner register`.
# Preserve each entry's id, token, token timestamps, name and URL.
concurrent = 3

# EC2 general runner tags: a305-linux-ci, a305-linux-light, a305-ec2, a305-linux (legacy jobs).
# Idle general slots can also pick up light checks; the dedicated light slot stays separate.
[[runners]]
  limit = 2
  executor = "docker"
  environment = ["FF_NETWORK_PER_BUILD=true"]

  [runners.docker]
    image = "alpine:3.22"
    pull_policy = ["always", "if-not-present"]
    privileged = false
    services_privileged = true
    allowed_privileged_services = ["docker:29.1.3-dind-rootless", "docker.io/library/docker:29.1.3-dind-rootless"]
    allowed_services = ["docker:29.1.3-dind-rootless", "docker.io/library/docker:29.1.3-dind-rootless"]
    cpus = "2"
    memory = "3g"
    memory_swap = "3g"
    service_cpus = "1"
    service_memory = "2g"
    service_memory_swap = "2g"
    services_limit = 1
    wait_for_services_timeout = 60
    volumes = ["/cache"]

# EC2 light runner tags: a305-linux-light, a305-ec2.
[[runners]]
  limit = 1
  executor = "docker"
  environment = ["FF_NETWORK_PER_BUILD=true"]

  [runners.docker]
    image = "alpine:3.22"
    pull_policy = ["always", "if-not-present"]
    privileged = false
    services_privileged = false
    cpus = "1"
    memory = "1g"
    memory_swap = "1g"
    services_limit = 0
    volumes = ["/cache"]
