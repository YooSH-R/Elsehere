# Apply to the notebook's separately registered Linux Docker runner.
# Preserve its id, URL, token and token timestamps. GitLab tags: a305-linux-ci, a305-linux-light.
concurrent = 2

[[runners]]
  limit = 2
  executor = "docker"
  # vpnkit's subnet overlaps Docker Desktop's internal DNS network.
  environment = ["FF_NETWORK_PER_BUILD=true", "DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns"]

  [runners.docker]
    image = "alpine:3.22"
    pull_policy = ["always", "if-not-present"]
    privileged = false
    services_privileged = true
    allowed_privileged_services = ["docker:29.1.3-dind-rootless", "docker.io/library/docker:29.1.3-dind-rootless"]
    allowed_services = ["docker:29.1.3-dind-rootless", "docker.io/library/docker:29.1.3-dind-rootless"]
    cpus = "2"
    memory = "3g"
    memory_swap = "3g"
    service_cpus = "1"
    service_memory = "2g"
    service_memory_swap = "2g"
    services_limit = 1
    wait_for_services_timeout = 60
    volumes = ["/cache"]
